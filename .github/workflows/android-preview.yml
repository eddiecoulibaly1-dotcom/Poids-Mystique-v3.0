name: Android preview APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branche à compiler"
        required: true
        default: "main"
        type: string
  push:
    branches:
      - main
    paths:
      - "App.tsx"
      - "app.json"
      - "eas.json"
      - "package.json"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/android-preview.yml"

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-preview:
    name: Verify and build Android preview APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run typecheck

      - name: Abjad engine tests
        run: npm run test:engine

      - name: Export Android JavaScript bundle
        run: npx expo export --platform android

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Build preview APK with EAS
        run: eas build --platform android --profile preview --non-interactive --json > eas-build.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download generated APK
        shell: bash
        run: |
          BUILD_ID="$(node -e "const d=require('./eas-build.json'); const all=Array.isArray(d)?d:(d.builds||[d]); const b=all.find(x=>x.id)||all[0]; if(!b?.id) process.exit(2); process.stdout.write(b.id)")"
          mkdir -p artifacts
          eas build:download --build-id "$BUILD_ID" --non-interactive
          APK_PATH="$(find . -maxdepth 3 -type f -name '*.apk' -not -path './artifacts/*' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "No APK file was produced by EAS build:download."
            find . -maxdepth 3 -type f -print
            exit 1
          fi
          cp "$APK_PATH" artifacts/poids-mystique-preview.apk
          test -s artifacts/poids-mystique-preview.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Publish APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: poids-mystique-preview-apk
          path: artifacts/poids-mystique-preview.apk
          if-no-files-found: error
          retention-days: 14
